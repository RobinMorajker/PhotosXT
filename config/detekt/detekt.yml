# Overrides on top of detekt's default rules (buildUponDefaultConfig = true).
complexity:
  # An exhaustive `when` over an enum that gives each entry one value or one call (a tool's
  # label, the handler of an operation) is a table, not a tangle of branches: such entries
  # do not count. The editor's 15 tools made every such table trip the default.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  # Compose components take flat parameter lists (Compose API guidelines).
  # Retrofit methods take one parameter per Drive query parameter, and a Room query one per bound
  # column. A Hilt constructor lists the class's collaborators; review judges those, not a count.
  LongParameterList:
    ignoreAnnotated: ['Composable', 'GET', 'POST', 'PATCH', 'DELETE', 'Query', 'Inject', 'AssistedInject']
  # A Room DAO is a list of queries, and a Room database the list of its DAOs. Private helpers
  # (small composables above all) do not count, and a ViewModel has one function per UI event,
  # so classes get a few more than files.
  TooManyFunctions:
    ignoreAnnotated: ['Dao', 'Database']
    ignorePrivate: true
    thresholdInClasses: 15
    # A source's interface (DeviceStore: MediaStore's reads and writes) lists its operations.
    thresholdInInterfaces: 15

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  # Early `?: return null` guards are how Kotlin parsers read; they do not count.
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    # Enum entries name their own constructor arguments.
    ignoreEnums: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
