# Overrides on top of detekt's default rules (buildUponDefaultConfig = true).
complexity:
  # Compose components take flat parameter lists (Compose API guidelines).
  LongParameterList:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  # Early `?: return null` guards are how Kotlin parsers read; they do not count.
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    # Enum entries name their own constructor arguments.
    ignoreEnums: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
