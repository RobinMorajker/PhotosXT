org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
# Unit tests compare screenshots with src/test/screenshots; ./gradlew recordRoborazziDebug re-records them.
roborazzi.test.verify=true
